[project]
name = "spellspeak-glyph-rc1"
version = "0.1.0"
description = "SpellSpeak Glyph 2B rc1: the reference runtime and an example. Tested with pydantic 2.13.5 and huggingface_hub 0.36.2. The example needs llama-server from llama.cpp build b11146 or later, and fetches the GGUF file from Hugging Face when it is not beside it"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "huggingface_hub>=0.30",
]

[tool.uv]
package = false
