[project]
name = "spellspeak-tone-rc1"
version = "0.1.0"
description = "SpellSpeak Tone rc1: the reference runtime and an example. Tested with onnxruntime 1.24.4 and 1.30.0, tokenizers 0.23.2, numpy 2.5.3, pydantic 2.13.5"
requires-python = ">=3.12"
dependencies = [
    "onnxruntime>=1.24",
    "tokenizers>=0.23",
    "numpy>=2.0",
    "pydantic>=2.6",
]

[tool.uv]
package = false
