[project]
name = "tone-pipecat"
version = "0.1.0"
description = "Characters in one Pipecat bot; SpellSpeak Audience routes each turn, SpellSpeak Tone moves how they feel"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[daily,deepgram,elevenlabs,openai,runner,silero]==1.12.0",
    "python-dotenv>=1.1,<2",
    # Audience's and Tone's reference runtimes (their releases' runtime/ folders)
    "onnxruntime>=1.24",
    "tokenizers>=0.23",
    "numpy>=2.0",
    "pydantic>=2.6",
    "huggingface_hub>=0.30",  # fetches the model files when a release folder has none
]

[dependency-groups]
dev = ["ruff>=0.12.11,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
# The models' runtimes (the releases' runtime/ folders, put on the path by runtimes.py): sorted with
# this example's own modules, so they stay after `import runtimes`.
known-first-party = ["contracts", "harness"]
